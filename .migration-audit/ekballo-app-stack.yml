services:
  app:
    image: ekballo-academy:migration-20260714
    env_file:
      - .env
    networks:
      - escolaNet
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/version').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.docker.network: escolaNet
        traefik.http.routers.ekballo.entrypoints: websecure
        traefik.http.routers.ekballo.rule: Host(`ekballo.escoladodiscipuloimw.com.br`)
        traefik.http.routers.ekballo.tls.certresolver: letsencryptresolver
        traefik.http.services.ekballo.loadbalancer.server.port: "3000"

networks:
  escolaNet:
    external: true
